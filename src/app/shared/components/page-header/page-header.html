<header class="page-header">
    <div class="page-header-content">
        <h1 class="page-title">{{ title() }}</h1>

        @if (description()) {
            <p class="page-description">
                {{ description() }}
            </p>
        }
    </div>

    <div class="page-header-actions">
        <ng-content select="[pageActions]" />
    </div>
</header>
