<form [formGroup]="form" class="product-batches-form" autocomplete="off">
    <div class="form-field">
        <label for="product">Producto</label>

        <p-select
            inputId="product"
            formControlName="product_id"
            [options]="productsOptions()"
            optionLabel="label"
            optionValue="value"
            placeholder="Seleccione un producto"
            [showClear]="true"
            [filter]="true"
            filterBy="label"
            [fluid]="true"
            appendTo="body"
        />

        @if (getFieldError('product_id'); as error) {
            <small class="field-error">{{ error }}</small>
        }
    </div>

    <div class="form-field">
        <label for="code"> Numero de lote <span class="required">*</span> </label>

        <input
            pInputText
            id="batch_number"
            formControlName="batch_number"
            placeholder="Ingrese el número de lote"
            fluid
        />

        @if (getFieldError('batch_number'); as error) {
            <small class="field-error">{{ error }}</small>
        }
    </div>

    <div class="form-field">
        <label for="name"> Fecha de fabricación <span class="required">*</span> </label>

        <input
            pInputText
            id="manufacturing_date"
            formControlName="manufacturing_date"
            placeholder="Ingrese la fecha de fabricación"
            fluid
        />

        @if (getFieldError('manufacturing_date'); as error) {
            <small class="field-error">{{ error }}</small>
        }
    </div>

    <div class="form-field">
        <label for="expiration_date">Fecha de vencimiento</label>

        <input
            pInputText
            id="expiration_date"
            formControlName="expiration_date"
            placeholder="Ingrese la fecha de vencimiento"
            fluid
        />

        @if (getFieldError('expiration_date'); as error) {
            <small class="field-error">{{ error }}</small>
        }
    </div>

    <div class="form-field">
        <div class="toggle-field">
            <label for="is_active">Lote activo</label>

            <p-toggleswitch inputId="is_active" formControlName="is_active" />
        </div>
    </div>
</form>
