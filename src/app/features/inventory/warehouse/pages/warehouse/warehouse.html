<section class="warehouse-page">
    <header class="page-heading">
        <div>
            <h1>Bodegas</h1>
            <p>Administre las bodegas del sistema.</p>
        </div>
    </header>

    <app-data-grid
        [data]="warehouses()"
        [columns]="columns"
        [pagination]="pagination()"
        [config]="gridConfig()"
        [actions]="actions()"
        [loading]="loading()"
        [error]="error()"
        (queryChange)="onQueryChange($event)"
        (refresh)="refresh()"
        (create)="onCreate()"
        (actionClick)="onAction($event)"
    />

    <app-form-dialog
        [(visible)]="dialogVisible"
        [title]="dialogTitle()"
        [loading]="saving()"
        [saveDisabled]="saving()"
        saveLabel="Guardar"
        (save)="saveWarehouse()"
    >
        <app-warehouse-form [warehouse]="selectedWarehouse()" />
    </app-form-dialog>
</section>
