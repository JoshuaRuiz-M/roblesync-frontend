<form [formGroup]="form" class="user-password-form">
    <div class="form-description">
        <p>
            Establezca una nueva contraseña para el usuario
            <strong>{{ user().username }}</strong
            >.
        </p>
    </div>

    <div class="form-field">
        <label for="new_password"> Nueva contraseña * </label>

        <p-password
            inputId="new_password"
            formControlName="password"
            placeholder="Ingrese la nueva contraseña"
            [toggleMask]="true"
            [feedback]="false"
            [fluid]="true"
        />

        @if (getFieldError('password'); as error) {
            <small class="field-error">{{ error }}</small>
        }
    </div>

    <div class="form-field">
        <label for="confirm_password"> Confirmar contraseña * </label>

        <p-password
            inputId="confirm_password"
            formControlName="confirmPassword"
            placeholder="Confirme la nueva contraseña"
            [toggleMask]="true"
            [feedback]="false"
            [fluid]="true"
        />

        @if (getFieldError('confirmPassword'); as error) {
            <small class="field-error">{{ error }}</small>
        }
    </div>

    <small class="field-hint"> La contraseña debe contener entre 12 y 128 caracteres. </small>
</form>
