<form [formGroup]="form" class="salesperson-form" autocomplete="off">
    <div class="form-field">
        <label for="user">Usuario <span class="required">*</span></label>

        <p-select
            inputId="user"
            formControlName="user_id"
            [options]="userOptions()"
            optionLabel="label"
            optionValue="value"
            placeholder="Seleccione un usuario"
            [showClear]="true"
            [filter]="true"
            filterBy="label"
            [fluid]="true"
            appendTo="body"
        />

        @if (getFieldError('user_id'); as error) {
            <small class="field-error">{{ error }}</small>
        }
    </div>

    <div class="form-field">
        <label for="employee_code"> Código <span class="required">*</span> </label>

        <input
            pInputText
            id="employee_code"
            formControlName="employee_code"
            placeholder="Ingrese el código del empleado"
            fluid
        />

        @if (getFieldError('employee_code'); as error) {
            <small class="field-error">{{ error }}</small>
        }
    </div>

    <div class="form-field">
        <label for="phone"> Teléfono <span class="required">*</span> </label>

        <input
            pInputText
            id="phone"
            formControlName="phone"
            placeholder="Ingrese el teléfono del vendedor"
            fluid
        />

        @if (getFieldError('phone'); as error) {
            <small class="field-error">{{ error }}</small>
        }
    </div>

    <div class="form-field">
        <div class="toggle-field">
            <label for="is_active">Vendedor activo</label>

            <p-toggleswitch inputId="is_active" formControlName="is_active" />
        </div>
    </div>
</form>
