<form [formGroup]="form" class="password-form">
    @if (errorMessage(); as error) {
        <div class="form-error" role="alert">
            <i class="pi pi-exclamation-circle" aria-hidden="true"></i>
            <span>{{ error }}</span>
        </div>
    }

    <div class="field">
        <label for="current_password">Contraseña actual</label>

        <p-password
            inputId="current_password"
            formControlName="current_password"
            [feedback]="false"
            [toggleMask]="true"
            [fluid]="true"
        />

        @if (getFieldError('current_password'); as error) {
            <small class="field-error">{{ error }}</small>
        }
    </div>

    <div class="field">
        <label for="new_password">Nueva contraseña</label>

        <p-password
            inputId="new_password"
            formControlName="new_password"
            [feedback]="false"
            [toggleMask]="true"
            [fluid]="true"
        />

        @if (getFieldError('new_password'); as error) {
            <small class="field-error">{{ error }}</small>
        }
    </div>

    <div class="field">
        <label for="confirmPassword">Confirmar nueva contraseña</label>

        <p-password
            inputId="confirmPassword"
            formControlName="confirmPassword"
            [feedback]="false"
            [toggleMask]="true"
            [fluid]="true"
        />

        @if (getFieldError('confirmPassword'); as error) {
            <small class="field-error">{{ error }}</small>
        }
    </div>
</form>
