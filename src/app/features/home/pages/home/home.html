@if (canViewDashboard()) {
    <app-dashboard></app-dashboard>
} @else {
    <section class="home">
        <div class="home-content">
            <div class="home-logo">
                <i class="pi pi-box"></i>
            </div>

            <h1>{{ appName }}</h1>

            <p class="home-subtitle">Bienvenido al sistema</p>

            <p class="home-description">{{ appDescription }}</p>
        </div>
    </section>
}
