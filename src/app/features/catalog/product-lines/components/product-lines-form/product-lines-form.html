<form [formGroup]="form" class="product-lines-form" autocomplete="off">
    <div class="form-field">
        <label for="code"> Código <span class="required">*</span> </label>

        <input
            pInputText
            id="code"
            formControlName="code"
            placeholder="Ingrese el código de la línea de producto"
            fluid
        />

        @if (getFieldError('code'); as error) {
            <small class="field-error">{{ error }}</small>
        }
    </div>

    <div class="form-field">
        <label for="name"> Nombre <span class="required">*</span> </label>

        <input
            pInputText
            id="name"
            formControlName="name"
            placeholder="Ingrese el nombre de la línea de producto"
            fluid
        />

        @if (getFieldError('name'); as error) {
            <small class="field-error">{{ error }}</small>
        }
    </div>

    <div class="form-field">
        <label for="category">Categoría</label>

        <p-select
            inputId="category"
            formControlName="category_id"
            [options]="categoryOptions()"
            optionLabel="label"
            optionValue="value"
            placeholder="Seleccione una Categoría"
            [showClear]="true"
            [filter]="true"
            filterBy="label"
            [fluid]="true"
            appendTo="body"
        />

        @if (getFieldError('category_id'); as error) {
            <small class="field-error">{{ error }}</small>
        }
    </div>

    <div class="form-field">
        <label for="description">Descripción</label>

        <textarea
            rows="5"
            pTextarea
            id="description"
            formControlName="description"
            placeholder="Ingrese la descripción de la línea de producto"
        ></textarea>

        @if (getFieldError('description'); as error) {
            <small class="field-error">{{ error }}</small>
        }
    </div>

    <div class="form-field">
        <div class="toggle-field">
            <label for="is_active">Línea de producto activa</label>

            <p-toggleswitch inputId="is_active" formControlName="is_active" />
        </div>
    </div>
</form>
