<section class="brands-page">
    <header class="page-heading">
        <div>
            <h1>Marcas</h1>
            <p>Administre las marcas del sistema.</p>
        </div>
    </header>

    <app-data-grid
        [data]="brands()"
        [columns]="columns"
        [pagination]="pagination()"
        [config]="gridConfig()"
        [actions]="actions()"
        [loading]="loading()"
        [error]="error()"
        (queryChange)="onQueryChange($event)"
        (refresh)="refresh()"
        (create)="onCreate()"
        (actionClick)="onAction($event)"
    />

    <app-form-dialog
        [(visible)]="dialogVisible"
        [title]="dialogTitle()"
        [loading]="saving()"
        [saveDisabled]="saving()"
        saveLabel="Guardar"
        (save)="saveBrand()"
    >
        <app-brand-form [brand]="selectedBrand()" />
    </app-form-dialog>

</section>
